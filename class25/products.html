<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      /* small niceties */
      body {
        padding: 2rem;
        background: #f8f9fa;
      }
      .card-img-top {
        object-fit: cover;
        height: 160px;
      }
      .card {
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      }
    </style>
  </head>
  <body>
  
    <div class="container">
      <div class="row g-4">
          <h1>Loading...</h1>
      </div>
    </div>

    <script>
      const getProducts = async () => {
        try {
          const response = await fetch("https://fakestoreapi.com/products");
          console.log(response, "response");
          if (response.ok === false) {
            throw new Error("Error while getting products");
          }
          const data = await response.json();
          console.log(data, "data");
          createSuccessUi(data);
        } catch (error) {
          console.log(error, "error");
          createFailUi(error);
        } finally {
          console.log("finally");
        }
      };
      getProducts();

      function createSuccessUi(products) {
        // console.log(products, "products");
        const productCards = products.map((product) => {
          console.log(product, "product");
          return `<div class="col-12 col-sm-6 col-md-4 col-lg-3">
          <div class="card h-100">
            <img
              src=${product.image}
              class="card-img-top"
              alt=${product.title}
            />
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">${product.title}</h5>
              <p class="card-text flex-grow-1">
                ${product.description}
              </p>
              <div class="mt-3">
                <a href="#" class="btn btn-primary btn-sm">View</a>
                <a href="#" class="btn btn-outline-secondary btn-sm">Details</a>
              </div>
            </div>
            <div class="card-footer text-muted small">Updated 2 days ago</div>
          </div>
        </div>`;
        });
        const row = document.querySelector(".row");
        console.log(productCards, "productCards", productCards.join(""));

        row.innerHTML = productCards.join("");
      }
      function createFailUi(error) {
        console.log(error, "error");
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
